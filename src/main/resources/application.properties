spring.application.name=remembered
server.port=${PORT:8080}
# Cloud Run/Render terminam o HTTPS no proxy; sem isto o Swagger anuncia http:// e o "Try it out" falha.
server.forward-headers-strategy=framework

# ---------- Oracle (schema compartilhado com a API .NET: TB_ = Java, NET_ = .NET) ----------
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521/orcl}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jackson.time-zone=America/Sao_Paulo

# O schema pode ja conter as tabelas NET_ da API .NET: a baseline na versao 0 faz o Flyway aceitar
# o schema existente e ainda assim aplicar as migrations do Java.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# O schema da FIAP e compartilhado (pethub, .NET): historico proprio para nao colidir com o flyway_schema_history deles.
spring.flyway.table=FLYWAY_HISTORY_REMEMBERED

# ---------- JWT (o mesmo segredo e audience valem para a API .NET) ----------
remembered.jwt.segredo=${JWT_SECRET}
remembered.jwt.audience=${JWT_AUDIENCE:remembered}
remembered.jwt.issuer=${JWT_ISSUER:remembered-java}
remembered.jwt.issuers-aceitos=${JWT_ISSUERS_ACEITOS:remembered-java,remembered-dotnet}
remembered.jwt.validade=PT24H

# ---------- Regras de negocio ----------
remembered.doses.dias-a-frente=7
remembered.doses.tolerancia-minutos=30
remembered.doses.intervalo-job-ms=60000
# O banco da Azure e compartilhado: na maquina de cada integrante, JOBS_HABILITADOS=false
# deixa so a API da Azure gerar a agenda e marcar as doses vencidas.
remembered.jobs.habilitados=${JOBS_HABILITADOS:true}
remembered.pareamento.validade-minutos=15

# ---------- Spring AI com Groq (API compativel com a da OpenAI) ----------
# A chave NUNCA vai versionada: vem de GROQ_API_KEY. Sem chave o relatorio sai so com os numeros.
spring.ai.openai.api-key=${GROQ_API_KEY:sem-chave}
# Spring AI 2.x: base-url com /v1. Se a primeira chamada der 404, troque para https://api.groq.com/openai
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.3
# So o chat e usado: desliga os demais modelos que o starter da OpenAI ligaria.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
remembered.ia.timeout=PT15S

# ---------- RabbitMQ (CloudAMQP) ----------
# URL completa do painel do CloudAMQP, no formato amqps://usuario:senha@host/vhost (ssl liga sozinho com amqps).
spring.rabbitmq.addresses=${CLOUDAMQP_URL}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# RABBIT_CONSUMIDORES=false no desenvolvimento local: a maquina publica eventos, mas nao consome
# as filas de producao no lugar da API da Azure.
spring.rabbitmq.listener.simple.auto-startup=${RABBIT_CONSUMIDORES:true}
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# O broker pode estar fora do ar sem derrubar a API (a publicacao falha no log e o dado fica gravado).
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# ---------- Push (Expo) ----------
remembered.push.url=https://exp.host/--/api/v2/push/send

# ---------- Documentacao e saude ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
